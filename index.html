<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Presenter</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#111;color:#eee;font-family:Segoe UI,system-ui,sans-serif}
#start{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;text-align:center}
#start button,.btn{background:#2d6cdf;color:#fff;border:0;border-radius:8px;padding:12px 22px;font-size:16px;cursor:pointer}
.btn.sm{padding:6px 12px;font-size:13px;background:#333}
#app{display:none;height:100%;flex-direction:column}
#top{display:flex;gap:10px;padding:10px;flex:1;min-height:0}
.panel{background:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;position:relative}
#curP{flex:3}#side{flex:1.4;display:flex;flex-direction:column;gap:10px;min-width:0}
#nextP{flex:1}
#info{background:#1c1c1c;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
#timer{font-size:38px;font-variant-numeric:tabular-nums;font-weight:600}
#clock{color:#aaa}
.lbl{position:absolute;top:6px;left:10px;font-size:12px;color:#888}
canvas{max-width:100%;max-height:100%}
#strip{height:128px;background:#1a1a1a;display:flex;gap:8px;overflow-x:auto;padding:8px 10px;border-top:1px solid #333}
.th{flex:0 0 auto;height:100%;position:relative;cursor:pointer;border:3px solid transparent;border-radius:4px;background:#000;display:flex;align-items:center}
.th canvas{height:100%;width:auto;display:block}
.th.on{border-color:#ffb020}
.th span{position:absolute;left:3px;bottom:2px;background:#000a;font-size:11px;padding:0 4px;border-radius:3px}
#pg{font-size:18px}
</style></head><body>
<div id="start">
  <h1>PDF Presenter</h1>
  <p>Open a PDF and present it with a PowerPoint-style Presenter View.</p>
  <button onclick="fi.click()">Open PDF</button>
  <input type="file" id="fi" accept="application/pdf" hidden>
  <small id="msg" style="color:#aaa"></small>
</div>
<div id="app">
  <div id="top">
    <div class="panel" id="curP"><span class="lbl">CURRENT</span><canvas id="cur"></canvas></div>
    <div id="side">
      <div class="panel" id="nextP"><span class="lbl">NEXT</span><canvas id="nxt"></canvas></div>
      <div id="info">
        <div id="timer">00:00:00</div><div id="clock"></div><div id="pg"></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn sm" onclick="openAud()">Open audience window</button>
          <button class="btn sm" onclick="togTimer()">Pause/Start</button>
          <button class="btn sm" onclick="resetTimer()">Reset</button>
          <button class="btn sm" onclick="blank()">Black (B)</button>
        </div>
        <small style="color:#888">←/→, ↑/↓, Space, PgUp/PgDn, Home/End. Click a thumbnail to jump. Move the audience window to the projector and press F or double-click it for fullscreen.</small>
      </div>
    </div>
  </div>
  <div id="strip"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let pdf,n=0,cur=1,aud=null,black=false,secs=0,running=true;
const fi=$('fi');
async function init(){
  try{
    const r=await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([await r.text()],{type:'text/javascript'}));
  }catch(e){$('msg').textContent='Could not load PDF engine (internet needed once).'}
}
init();
fi.onchange=async()=>{
  const f=fi.files[0];if(!f)return;
  pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
  n=pdf.numPages;cur=1;
  $('start').style.display='none';$('app').style.display='flex';
  document.title=f.name;
  buildStrip();show();
};
async function draw(canvas,num,bw,bh,dprIn){
  const id=(canvas._id=(canvas._id||0)+1);
  if(canvas._task){try{canvas._task.cancel()}catch(e){}}
  const p=await pdf.getPage(num),v1=p.getViewport({scale:1});
  const dpr=Math.max(dprIn||window.devicePixelRatio||1,1);
  const s=Math.min(bw/v1.width,bh/v1.height);
  const v=p.getViewport({scale:s*dpr});
  const off=document.createElement('canvas');
  off.width=Math.floor(v.width);off.height=Math.floor(v.height);
  const task=p.render({canvasContext:off.getContext('2d'),viewport:v});
  canvas._task=task;
  try{await task.promise}catch(e){return}
  if(canvas._id!==id)return;
  canvas.width=off.width;canvas.height=off.height;
  canvas.style.width=off.width/dpr+'px';canvas.style.height=off.height/dpr+'px';
  canvas.getContext('2d').drawImage(off,0,0);
}
let token=0;
async function show(){
  const t=++token;
  $('pg').textContent=`Slide ${cur} / ${n}`;
  document.querySelectorAll('.th').forEach((e,i)=>e.classList.toggle('on',i+1===cur));
  const on=document.querySelector('.th.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
  const a=$('curP'),b=$('nextP');
  await draw($('cur'),cur,a.clientWidth-20,a.clientHeight-20);
  if(t!==token)return;
  const nx=$('nxt');
  if(cur<n)await draw(nx,cur+1,b.clientWidth-20,b.clientHeight-20);
  else{nx.getContext('2d').clearRect(0,0,nx.width,nx.height);nx.width=1;nx.height=1}
  drawAud();
}
async function drawAud(){
  if(!aud||aud.closed)return;
  const d=aud.document,c=d.getElementById('c');if(!c)return;
  c.style.visibility=black?'hidden':'visible';
  await draw(c,cur,aud.innerWidth,aud.innerHeight,aud.devicePixelRatio);
}
let audT;function drawAudSoon(){clearTimeout(audT);audT=setTimeout(drawAud,120)}
async function buildStrip(){
  const s=$('strip');s.innerHTML='';
  for(let i=1;i<=n;i++){
    const d=document.createElement('div');d.className='th';
    d.innerHTML='<canvas></canvas><span>'+i+'</span>';
    d.onclick=()=>go(i);s.appendChild(d);
  }
  for(let i=1;i<=n;i++){
    const c=s.children[i-1].querySelector('canvas');
    await draw(c,i,260,110);
    c.style.width='auto';c.style.height='100%';
  }
}
function go(i){cur=Math.max(1,Math.min(n,i));black=false;show()}
function blank(){black=!black;drawAud()}
function key(e){
  if(!pdf)return;
  const k=e.key;
  if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(k)){go(cur+1)}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){go(cur-1)}
  else if(k==='Home')go(1);else if(k==='End')go(n);
  else if(k==='b'||k==='B'||k==='.')blank();
  else if(k==='f'||k==='F'){const w=e.view===aud?aud.document:document;w.documentElement.requestFullscreen&&w.documentElement.requestFullscreen()}
  else return;
  e.preventDefault();
}
document.addEventListener('keydown',key);
function openAud(){
  if(aud&&!aud.closed){aud.focus();return}
  aud=window.open('','aud','width=960,height=540');
  if(!aud){alert('Allow popups for this page.');return}
  aud.document.write('<!doctype html><title>Audience</title><body style="margin:0;background:#000;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden"><canvas id="c"></canvas></body>');
  aud.document.close();
  aud.addEventListener('keydown',key);
  aud.addEventListener('resize',drawAudSoon);
  aud.document.addEventListener('dblclick',()=>aud.document.documentElement.requestFullscreen());
  aud.document.addEventListener('click',()=>go(cur+1));
  aud.document.addEventListener('contextmenu',e=>{e.preventDefault();go(cur-1)});
  drawAud();
}
window.addEventListener('resize',()=>{if(pdf)show()});
window.addEventListener('beforeunload',()=>{if(aud&&!aud.closed)aud.close()});
function fmt(s){return[s/3600|0,(s/60|0)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')}
function togTimer(){running=!running}
function resetTimer(){secs=0}
setInterval(()=>{if(running)secs++;$('timer').textContent=fmt(secs);$('clock').textContent=new Date().toLocaleTimeString()},1000);
</script></body></html>
